openapi: 3.0.3
info:
  title: Devour Auth 开放 API
  version: 1.0.0
  description: |
    供代理发货系统或第三方对接。每个请求必须带四个头：

    - `X-Api-Key`：密钥 ID（创建时返回）
    - `X-Timestamp`：Unix 秒，与服务端偏差不超过 300 秒
    - `X-Nonce`：随机串，5 分钟内不可重复
    - `X-Signature`：`hex(hmac_sha256(secret, method + "\n" + path + "\n" + timestamp + "\n" + nonce + "\n" + body))`

    `path` 不含域名与查询串；`body` 为原始 JSON 文本，GET 时为空串。
servers:
  - url: https://net.namikao.com
security: []
paths:
  /open/v1/cards/generate:
    post:
      summary: 批量发卡
      description: 需要 `cards:write`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_id, qty]
              properties:
                policy_id: { type: integer }
                qty: { type: integer, minimum: 1, maximum: 500 }
                prefix: { type: string }
                note: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      batch_id: { type: integer }
                      qty: { type: integer }
                      kamis:
                        type: array
                        items: { type: string }
  /open/v1/cards/query:
    post:
      summary: 查询卡密
      description: 需要 `cards:read`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kami]
              properties:
                kami: { type: string }
      responses:
        '200': { description: 返回卡对象 }
        '404': { description: CARD_NOT_FOUND }
  /open/v1/cards/extend:
    post:
      summary: 续期 / 加点数 / 加次数 / 加秒数
      description: 需要 `cards:write`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kami]
              properties:
                kami: { type: string }
                days: { type: integer }
                times: { type: integer }
                points: { type: integer }
                seconds: { type: integer }
      responses:
        '200': { description: 成功 }
  /open/v1/cards/unbind:
    post:
      summary: 清空该卡的全部设备绑定
      description: 需要 `cards:write`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kami]
              properties:
                kami: { type: string }
      responses:
        '200': { description: 成功 }
  /open/v1/cards/entitlements/grant:
    post:
      summary: 给单卡附加权限
      description: 需要 `cards:write`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kami, code]
              properties:
                kami: { type: string }
                code: { type: string }
                expires_at: { type: integer, description: 0 表示跟随卡 }
      responses:
        '200': { description: 成功 }
  /open/v1/stats/online:
    get:
      summary: 当前在线会话数
      description: 需要 `stats:read`；body 为空串
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      online: { type: integer }
                      server_time: { type: integer }

  # ---------- 终端客户端协议（design.md 第 12 节） ----------
  /v1/meta:
    get:
      summary: 获取客户端元信息（免登录）
      description: |
        返回当前应用的公告、维护开关、远程变量、离线票据公钥，以及（灰度命中时）最新版本。
        `app_id` / `app` 都不传时取第一个应用；`fp` 用于版本灰度判定。
      security: []
      parameters:
        - name: app_id
          in: query
          schema: { type: integer, format: int64 }
        - name: app
          in: query
          description: 应用 code
          schema: { type: string }
        - name: fp
          in: query
          description: 设备指纹，用于版本灰度
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/MetaData' }
        '404':
          description: '404 BAD_INPUT：应用不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorBody' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/offline-ticket:
    post:
      summary: 签发离线票据
      description: |
        需要 Bearer access token。服务端用 Ed25519 签发，有效期不超过策略的 `offline_hours`
        （默认 24 小时），且不超过卡到期时间。本期只做签发，客户端断网时本地验签。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/OfflineTicketData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/auth/login:
    post:
      summary: 登录
      description: |
        用卡密与设备指纹换取令牌。`ts` 与服务端偏差超过 300 秒拒绝，`nonce` 5 分钟内去重。
        限流：5 次/分/IP、20 次/时/卡密。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/auth/refresh:
    post:
      summary: 刷新令牌
      description: |
        用 refresh_token 换新的一对令牌，旧 refresh 立即失效。
        旧 refresh 再次出现视为盗用，吊销该卡全部会话并返回 REVOKED。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/auth/logout:
    post:
      summary: 登出
      description: 需要 Bearer access token；吊销当前会话。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [logged_out]
                    properties:
                      logged_out: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/session:
    get:
      summary: 查询会话状态（心跳）
      description: |
        需要 Bearer access token。返回卡状态、余额与权限，`server_time` 用作对时。
        计时卡在此按心跳间隔扣秒。

        卡暂停时仍返回 HTTP 200，但 `ok=false`、`code=PAUSED`，`data` 中带卡余额，
        客户端据此关闭全部功能。
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 正常，或 PAUSED 状态（ok=false）
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  code:
                    type: string
                    description: 仅 PAUSED 时出现
                    enum: [PAUSED]
                  message:
                    type: string
                    description: 仅 PAUSED 时出现
                  data: { $ref: '#/components/schemas/SessionView' }
                  server_time:
                    type: integer
                    format: int64
                    description: 仅 PAUSED 时出现在顶层
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/consume:
    post:
      summary: 消耗点数 / 次数
      description: |
        需要 Bearer access token。按权限定价扣点/扣次，返回 `balance_after`。
        `nonce` 最短 16 字符且全局唯一，重复请求返回上次结果并置 `replayed=true`。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsumeRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/ConsumeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/pause:
    post:
      summary: 暂停 / 恢复计时
      description: 需要 Bearer access token。仅 `timed` 卡支持，其他卡类型返回 BAD_INPUT。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PauseRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/SessionView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/query/captcha:
    get:
      summary: 取查卡图形验证码
      description: |
        返回 4 位数字验证码 PNG（data URI），2 分钟有效，一次验证即失效。
        发码按 IP 限流 30 次/分。查卡前必须先取码。
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/QueryCaptchaData' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/query:
    post:
      summary: 凭卡密查状态（免登录）
      description: |
        不返回卡密本身，也不需要登录。必须带图形验证码（先调 GET /v1/query/captcha）；
        查卡按 IP 限流 10 次/分，验证码错误返回 400。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryWithCaptchaRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data: { $ref: '#/components/schemas/QueryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /v1/query/unbind:
    post:
      summary: 自助解绑设备（免登录）
      description: 凭卡密清空该卡的全部设备绑定，受策略的免费换绑次数限制；按 IP 限流 5 次/分。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [unbound]
                    properties:
                      unbound: { type: boolean, enum: [true] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <access_token>`'
  responses:
    BadRequest:
      description: '400 BAD_INPUT：请求体格式错误、字段缺失或 nonce 非法'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Unauthorized:
      description: '401 UNAUTHORIZED / REVOKED：令牌缺失、无效、过期或已吊销'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Forbidden:
      description: '403 CARD_EXPIRED / CARD_BANNED / CARD_EXHAUSTED / DEVICE_LIMIT / DEVICE_MISMATCH / ENTITLEMENT_MISSING'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    NotFound:
      description: '404 CARD_NOT_FOUND：卡密不存在'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Conflict:
      description: '409 PAUSED / MAINTENANCE，或自助解绑的状态校验失败（BAD_INPUT）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    TooManyRequests:
      description: '429 RATE_LIMITED：请求过于频繁'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
    Internal:
      description: '500 INTERNAL：服务内部错误'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }

  schemas:
    ErrorBody:
      type: object
      required: [ok, code, message, server_time]
      properties:
        ok: { type: boolean, enum: [false] }
        code:
          type: string
          enum:
            - BAD_INPUT
            - CARD_NOT_FOUND
            - CARD_EXPIRED
            - CARD_BANNED
            - CARD_EXHAUSTED
            - DEVICE_LIMIT
            - DEVICE_MISMATCH
            - UNAUTHORIZED
            - REVOKED
            - PAUSED
            - ENTITLEMENT_MISSING
            - RATE_LIMITED
            - MAINTENANCE
            - INTERNAL
        message: { type: string }
        server_time: { type: integer, format: int64 }

    DeviceInfo:
      type: object
      required: [fingerprint]
      properties:
        fingerprint: { type: string, description: 设备指纹，参与设备绑定与黑名单判定 }
        model: { type: string }
        brand: { type: string }
        os: { type: string }
        app_version: { type: string }

    Tokens:
      type: object
      properties:
        access_token: { type: string }
        access_exp: { type: integer, format: int64, description: access token 过期时间（Unix 秒） }
        refresh_token: { type: string }
        refresh_exp: { type: integer, format: int64, description: refresh token 过期时间（Unix 秒） }

    CardView:
      type: object
      required: [kind, expire_at, points, remain_times, remaining_seconds, paused, device_limit, bound_devices]
      properties:
        kind:
          type: string
          enum: [duration, count, credit, timed, trial, forever]
        expire_at: { type: integer, format: int64, description: 0 表示永久或未激活 }
        points: { type: integer, format: int64 }
        remain_times: { type: integer, format: int64 }
        remaining_seconds: { type: integer, format: int64 }
        paused: { type: boolean }
        device_limit: { type: integer, format: int64 }
        bound_devices: { type: integer, format: int64 }

    EntitlementView:
      type: object
      required: [code, cost_points, cost_times]
      properties:
        code: { type: string }
        cost_points: { type: integer, format: int64 }
        cost_times: { type: integer, format: int64 }

    SessionView:
      allOf:
        - $ref: '#/components/schemas/Tokens'
        - type: object
          required: [card, entitlements, server_time]
          properties:
            card: { $ref: '#/components/schemas/CardView' }
            entitlements:
              type: array
              items: { $ref: '#/components/schemas/EntitlementView' }
            server_time: { type: integer, format: int64 }

    LoginRequest:
      type: object
      required: [kami, device, ts, nonce]
      properties:
        kami: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo' }
        ts: { type: integer, format: int64, description: 客户端当前 Unix 秒，与服务端偏差不得超过 300 秒 }
        nonce:
          type: string
          minLength: 16
          description: 随机串，5 分钟内不可重复

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    ConsumeRequest:
      type: object
      required: [entitlement_code, nonce]
      properties:
        entitlement_code: { type: string }
        nonce: { type: string, minLength: 16, description: 全局唯一的幂等键 }

    ConsumeResponse:
      type: object
      required: [code, balance_after, cost_points, cost_times, remaining_points, remaining_times, replayed, server_time]
      properties:
        code: { type: string, description: 权限 code }
        balance_after:
          type: integer
          format: int64
          description: 扣减后的余额（扣点权限为点数，扣次权限为次数）
        cost_points: { type: integer, format: int64 }
        cost_times: { type: integer, format: int64 }
        remaining_points: { type: integer, format: int64 }
        remaining_times: { type: integer, format: int64 }
        replayed: { type: boolean, description: true 表示同一 nonce 的重放，返回上次结果 }
        server_time: { type: integer, format: int64 }

    PauseRequest:
      type: object
      required: [paused]
      properties:
        paused: { type: boolean }

    QueryRequest:
      type: object
      required: [kami]
      properties:
        kami: { type: string }

    QueryWithCaptchaRequest:
      allOf:
        - $ref: '#/components/schemas/QueryRequest'
        - type: object
          required: [captcha_id, captcha_code]
          properties:
            captcha_id: { type: string, description: GET /v1/query/captcha 返回的 id }
            captcha_code: { type: string, description: 4 位数字 }

    QueryCaptchaData:
      type: object
      required: [id, image]
      properties:
        id: { type: string }
        image: { type: string, description: 'data:image/png;base64,...' }

    QueryResponse:
      type: object
      required: [status, kind, duration_seconds, expire_at, points, remain_times, remaining_seconds, paused, device_limit, bound_devices, server_time]
      properties:
        status:
          type: string
          enum: [unused, active, expired, exhausted, banned, recycled]
        kind:
          type: string
          enum: [duration, count, credit, timed, trial, forever]
        duration_seconds: { type: integer, format: int64, description: 卡快照的总时长 }
        expire_at: { type: integer, format: int64 }
        points: { type: integer, format: int64 }
        remain_times: { type: integer, format: int64 }
        remaining_seconds: { type: integer, format: int64 }
        paused: { type: boolean }
        device_limit: { type: integer, format: int64 }
        bound_devices: { type: integer, format: int64 }
        server_time: { type: integer, format: int64 }

    MetaData:
      type: object
      required: [app, server_time, maintenance, notices, flags, ticket_pubkey]
      properties:
        app: { type: string, description: 应用 code }
        server_time: { type: integer, format: int64 }
        maintenance: { type: boolean }
        notices:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              kind: { type: string }
              title: { type: string }
              body: { type: string }
        flags:
          type: object
          additionalProperties: { type: string }
        ticket_pubkey:
          type: string
          description: 离线票据 Ed25519 公钥（Base64）
        release:
          type: object
          description: 灰度命中时才下发
          properties:
            version: { type: string }
            info: { type: string }
            url: { type: string }
            must: { type: boolean }
            rollout_bp: { type: integer, format: int64 }

    OfflineTicketData:
      type: object
      required: [ticket, signature, exp, public_key, server_time]
      properties:
        ticket:
          type: string
          description: 'Base64 编码的票据 JSON：{card, device, exp, entitlements, points}'
        signature:
          type: string
          description: Ed25519 签名（Base64）
        exp: { type: integer, format: int64 }
        public_key: { type: string, description: 签名公钥（Base64） }
        server_time: { type: integer, format: int64 }
